<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Noul Who — jevplay.games</title>
<style>
@font-face{font-family:Inter;src:url('../../public/brand/inter-var.woff2');font-weight:100 900}
@font-face{font-family:VT323;src:url('../../public/brand/vt323.woff2');font-weight:400}
:root{--pink:#F386A1;--ink:#1E1E1E;--grey:#DEDEDE;--paper:#FEFEFE}
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:420px;overflow:hidden}body{background:var(--pink);color:var(--ink);font-family:VT323,'JetBrains Mono',Consolas,monospace}.texture{position:absolute;inset:0;width:1280px;height:420px}.frame{position:absolute;inset:18px;border:1px solid var(--ink)}.crop{position:absolute;width:13px;height:13px;border-color:var(--ink);border-style:solid}.tl{top:7px;left:7px;border-width:1px 0 0 1px}.tr{top:7px;right:7px;border-width:1px 1px 0 0}.bl{bottom:7px;left:7px;border-width:0 0 1px 1px}.br{bottom:7px;right:7px;border-width:0 1px 1px 0}.tag{position:absolute;top:39px;left:44px;background:var(--ink);color:var(--pink);border:1px dotted var(--pink);outline:2px dotted var(--ink);padding:4px 10px;font-size:22px;letter-spacing:1px}h1{position:absolute;top:88px;left:40px;margin:0;font:700 92px/1.05 Inter,sans-serif;letter-spacing:-4.5px}.subtitle{position:absolute;top:203px;left:44px;background:var(--ink);color:var(--paper);font-size:30px;padding:5px 12px 6px}.chips{position:absolute;top:264px;left:44px;display:flex;gap:9px}.chip{background:var(--grey);border:1px solid var(--ink);font-size:23px;padding:3px 10px}.window{position:absolute;background:var(--grey);border:1px solid var(--ink);box-shadow:inset 0 0 0 2px var(--paper),3px 3px 0 var(--ink)}.bar{height:26px;background:var(--ink);color:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:0 9px;font-size:21px;letter-spacing:1px}.noul{left:645px;top:70px;width:232px;z-index:3}.noul .body{padding:14px}.word{background:var(--ink);color:var(--paper);font-size:57px;line-height:59px;text-align:center;letter-spacing:7px}.question{font-size:25px;margin:9px 0 13px}.prob{display:flex;justify-content:space-between;font-size:23px}.meter{border:1px solid var(--ink);height:15px;padding:2px;margin-top:6px;background:var(--paper)}.meter span{display:block;width:25%;height:100%;background:var(--ink)}.suspects{left:872px;top:126px;width:303px;z-index:2}.grid{display:grid;grid-template-columns:repeat(6,36px);gap:6px 9px;padding:12px 19px 8px}.tile{position:relative;width:36px;height:36px;outline:1px solid var(--pink);outline-offset:2px}.tile img{width:36px;height:36px;image-rendering:pixelated;display:block}.tile.out{outline:none}.out img{opacity:.36}.cross{position:absolute;inset:0;display:grid;place-items:center;font-size:31px;color:var(--ink);line-height:1;text-shadow:1px 0 var(--grey),-1px 0 var(--grey)}.grid-status{border-top:1px solid var(--ink);margin:0 13px 9px;padding-top:4px;font-size:19px;display:flex;justify-content:space-between}.loading{left:44px;top:324px;width:350px}.loading .bar{height:23px;font-size:19px;letter-spacing:0}.loading .body{padding:5px 10px 9px;font-size:20px}.stripes{height:9px;border:1px solid var(--ink);margin-top:4px;display:flex;gap:3px;padding:1px}.stripes i{width:7px;background:var(--ink);transform:skewX(-25deg)}.robot{position:absolute;left:1060px;top:25px;width:148px;height:125px;z-index:4}.footer{position:absolute;right:37px;bottom:25px;font-size:20px;background:var(--pink);padding:0 5px}
</style>
<svg class="texture" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#1E1E1E" opacity=".4"/></pattern></defs><rect width="1280" height="420" fill="url(#dots)"/><g id="blobs" fill="#1E1E1E"/></svg>
<div class="frame"></div><i class="crop tl"></i><i class="crop tr"></i><i class="crop bl"></i><i class="crop br"></i>
<div class="tag">JEVPLAY.GAMES/NOUL-WHO</div>
<h1>Noul Who</h1><div class="subtitle">24 faces. Yes or no. You or Jev.</div>
<div class="chips"><span class="chip">+noul</span><span class="chip">+deduction</span><span class="chip">+replays</span><span class="chip">+analytics</span></div>
<section class="window noul"><div class="bar"><span>NOUL</span><span>_ x</span></div><div class="body"><div class="word">NOUL</div><div class="question">is their hair red?</div><div class="prob"><span>p(yes)</span><span>0.25</span></div><div class="meter"><span></span></div></div></section>
<section class="window suspects"><div class="bar"><span>SUSPECTS</span><span>_ x</span></div><div class="grid" id="portraits"></div><div class="grid-status"><span>09 / 24 remain</span><span>YES / NO</span></div></section>
<svg class="robot" viewBox="0 0 182 154" xmlns="http://www.w3.org/2000/svg" aria-label="Jev raises one hand" fill="none" stroke="#1E1E1E" stroke-width="4" stroke-linejoin="round">
<path d="M72 29V13"/><path d="M66 5h12v10H66z" fill="#F386A1"/>
<path d="M34 106h78v43H34z" fill="#DEDEDE"/><path d="M58 113h30v20H58z" fill="#F386A1"/>
<rect x="15" y="30" width="113" height="83" rx="23" fill="#DEDEDE"/>
<path d="M17 60H9v25h8M128 60h8v25h-8" fill="#F386A1"/>
<rect x="27" y="48" width="89" height="45" rx="13" fill="#1E1E1E"/>
<path d="M42 74q10-17 20 0M80 74q10-17 20 0" stroke="#FEFEFE" stroke-width="4"/>
<path d="M57 102h28" stroke="#1E1E1E" stroke-width="3"/>
<path d="M116 120l25-18 10-26 14 6-9 34-29 22" fill="#DEDEDE"/>
<path d="M150 81l-8-12-1-13 7-2 6 12V42h8v22l5-18 7 3-5 25-7 13z" fill="#DEDEDE"/>
<path d="M25 142h20v10H25zM99 142h20v10H99z" fill="#F386A1"/>
</svg>
<section class="window loading"><div class="bar"><span>Jev 1.13</span><span>_ x</span></div><div class="body">thinking ... 4 questions left<div class="stripes" id="stripes"></div></div></section>
<div class="footer">noul-who.jevplay.games</div>
<script>
const ns='http://www.w3.org/2000/svg';
for(const [cx,cy,r] of [[737,353,158],[1179,41,153],[493,-37,108]])for(let y=cy-r;y<=cy+r;y+=6)for(let x=cx-r;x<=cx+r;x+=6){const d=Math.hypot(x-cx,y-cy)/r;if(d<1){const c=document.createElementNS(ns,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',.45+1.65*(1-d));document.querySelector('#blobs').append(c)}}
const remaining=new Set([2,5,8,10,13,17,19,22,24]);
for(let n=1;n<=24;n++){const tile=document.createElement('div');tile.className='tile'+(remaining.has(n)?'':' out');tile.innerHTML=`<img src="../../public/portraits/c${String(n).padStart(2,'0')}.svg" alt="Suspect ${n}">`+(remaining.has(n)?'':'<span class="cross">[x]</span>');document.querySelector('#portraits').append(tile)}
for(let n=0;n<22;n++)document.querySelector('#stripes').append(document.createElement('i'));
</script>
</html>
